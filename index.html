<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Anime | المنصة الأسطورية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="header-container">
            <a class="logo" onclick="nav('home')">
                <i class="fa-solid fa-crown"></i> WHO ANIME
            </a>
            
            <nav class="nav-links">
                <a onclick="nav('home')" id="nav-home" class="active">الرئيسية</a>
                <a onclick="nav('latest')" id="nav-latest">أحدث الحلقات</a>
                <a onclick="nav('favorites')" id="nav-favorites">المفضلة (<span id="favCount">0</span>)</a>
                <a onclick="nav('history')" id="nav-history">السجل</a>
            </nav>

            <div style="display: flex; gap: 10px;">
                <input type="text" id="searchInput" oninput="searchAnime()" placeholder="ابحث..." style="background: #111; border: 1px solid #333; padding: 6px 12px; border-radius: 20px; color: #fff; font-size: 0.75rem;">
                <button onclick="playRandomAnime()" class="btn-gold" style="padding: 6px 12px;"><i class="fa-solid fa-dice"></i></button>
            </div>
        </div>
    </header>

    <!-- المحتوى -->
    <main style="max-width: 1280px; margin: 20px auto; padding: 0 1rem;">
        
        <section id="sec-home" class="page-section active">
            <!-- البانر -->
            <div class="hero-banner">
                <div class="hero-content">
                    <span style="background: rgba(212,175,55,0.15); color: #d4af37; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;">🔥 الأنمي المتصدر</span>
                    <h1 class="hero-title">Attack on Titan <br><span>الهجوم على العمالقة</span></h1>
                    <p class="hero-desc">شاهد جميع الحلقات والأجزاء كاملة بجودة عالية وسيرفرات فائقة السرعة.</p>
                    <button onclick="openPlayer(1, 1)" class="btn-gold"><i class="fa-solid fa-play"></i> مشاهدة الآن</button>
                </div>
                <div class="hero-img-box">
                    <img src="https://cdn.myanimelist.net/images/anime/10/47347.jpg" alt="AOT">
                </div>
            </div>

            <h2 style="font-size: 1.1rem; margin-bottom: 1rem; color: #d4af37;">المكتبة الشاملة</h2>
            <div id="grid-home" class="anime-grid"></div>
        </section>

        <section id="sec-latest" class="page-section" style="display:none;"><div id="grid-latest" class="anime-grid"></div></section>
        <section id="sec-favorites" class="page-section" style="display:none;"><div id="grid-favorites" class="anime-grid"></div></section>
        <section id="sec-history" class="page-section" style="display:none;"><div id="grid-history" class="anime-grid"></div></section>
    </main>

    <!-- مشغل الفيديو -->
    <div id="playerModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:2000; align-items:center; justify-center; padding:1rem;">
        <div style="max-width:1000px; width:100%; background:#111; border-radius:16px; padding:1.5rem; border:1px solid #d4af37;">
            <div style="display:flex; justify-between; align-items:center; margin-bottom:1rem;">
                <h3 id="playerTitle" style="color:#d4af37; font-size:1.1rem;"></h3>
                <button onclick="closePlayer()" style="background:red; color:#fff; border:none; padding:5px 15px; border-radius:8px; cursor:pointer;">إغلاق</button>
            </div>
            <div style="aspect-ratio:16/9; width:100%; bg:#000;">
                <iframe id="animeIframe" src="" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="anime-data.js"></script>
    <script src="player.js"></script>
    <script src="app.js"></script>
</body>
</html>

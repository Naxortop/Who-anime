<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Anime | المنصة المليارية الخارقة 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark bg-dark text-gray-100 min-h-screen flex flex-col font-sans">
    
    <!-- نظام التنبيهات الفوري -->
    <div id="toast" class="glass-card px-6 py-3 rounded-full text-gold font-bold shadow-2xl flex items-center gap-3 border border-gold/50">
        <i id="toastIcon" class="fa-solid fa-circle-check"></i>
        <span id="toastMsg">تمت العملية بنجاح</span>
    </div>

    <!-- الشريط العلوي الاحترافي -->
    <header class="fixed top-0 w-full z-50 glass-card px-4 lg:px-8 py-3.5 shadow-2xl">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-6">
                <div class="text-xl lg:text-2xl font-black cursor-pointer gold-text tracking-wider flex items-center gap-2" onclick="nav('home')">
                    <i class="fa-solid fa-crown text-lg animate-bounce"></i> WHO ANIME
                </div>
                <nav class="hidden md:flex gap-5 font-bold text-xs lg:text-sm">
                    <a onclick="nav('home')" id="nav-home" class="cursor-pointer hover:text-gold transition text-gold">الرئيسية</a>
                    <a onclick="nav('latest')" id="nav-latest" class="cursor-pointer hover:text-gold transition text-gray-300">أحدث الحلقات</a>
                    <a onclick="nav('favorites')" id="nav-favorites" class="cursor-pointer hover:text-gold transition text-gray-300">المفضلة (<span id="favCount">0</span>)</a>
                    <a onclick="nav('history')" id="nav-history" class="cursor-pointer hover:text-gold transition text-gray-300">سجل المشاهدة</a>
                </nav>
            </div>
            <div class="flex items-center gap-2 lg:gap-3">
                <input type="text" id="searchInput" oninput="searchAnime()" placeholder="ابحث في آلاف الأعمال..." class="bg-dark border border-dark-border rounded-full px-4 py-1.5 text-xs focus:outline-none focus:border-gold w-44 lg:w-64 text-white">
                <button onclick="playRandomAnime()" class="w-8 h-8 rounded-full border border-dark-border hover:border-gold hover:text-gold flex items-center justify-center text-xs"><i class="fa-solid fa-dice"></i></button>
                <button onclick="openRequestModal()" class="w-8 h-8 rounded-full border border-dark-border hover:border-gold hover:text-gold flex items-center justify-center text-xs"><i class="fa-solid fa-film"></i></button>
                <button onclick="toggleTheme()" class="w-8 h-8 rounded-full border border-dark-border hover:border-gold hover:text-gold flex items-center justify-center text-xs"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
            </div>
        </div>
    </header>

    <!-- شريط الموبايل -->
    <div class="md:hidden flex justify-around bg-dark/95 border-b border-dark-border py-2 px-2 fixed top-[56px] w-full z-40 text-xs font-bold shadow-md">
        <a onclick="nav('home')" id="mob-home" class="text-gold">الرئيسية</a>
        <a onclick="nav('latest')" id="mob-latest" class="text-gray-400">الأحدث</a>
        <a onclick="nav('favorites')" id="mob-favorites" class="text-gray-400">المفضلة</a>
        <a onclick="nav('history')" id="mob-history" class="text-gray-400">السجل</a>
    </div>

    <!-- المحتوى -->
    <main class="flex-1 pt-28 md:pt-24 pb-12 px-4 lg:px-8 max-w-7xl mx-auto w-full">
        <section id="sec-home" class="page-section active">
            <div class="relative rounded-3xl overflow-hidden glass-card p-6 md:p-12 mb-10 flex flex-col md:flex-row items-center justify-between gap-8 shadow-2xl border border-gold/30">
                <div class="relative z-10 md:w-3/5 space-y-4">
                    <div class="inline-block bg-gold/15 text-gold px-4 py-1.5 rounded-full text-xs font-bold border border-gold/40">
                        <i class="fa-solid fa-fire ml-2"></i> النظام الخماسي المتقدم 2026
                    </div>
                    <h1 class="text-3xl md:text-5xl font-black leading-tight">Attack on Titan <br><span class="gold-text text-2xl md:text-3xl">الهجوم على العمالقة</span></h1>
                    <p class="text-gray-400 text-sm leading-relaxed max-w-xl">أضخم منصة أنمي مقسمة بملفات برمجية ضخمة وممتلئة بالأكواد لتوفير أقصى سرعة وأداء.</p>
                    <div class="flex gap-4 pt-2">
                        <button onclick="openPlayer(1, 1)" class="gold-bg text-black font-bold px-7 py-3 rounded-xl hover:scale-105 transition flex items-center gap-2 shadow-lg"><i class="fa-solid fa-play"></i> مشاهدة الحلقة 1</button>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-2.5 overflow-x-auto pb-4 mb-6">
                <button onclick="filterGenre('الكل', this)" class="genre-btn active px-4 py-2 rounded-xl text-xs font-bold bg-gold text-black">الكل</button>
                <button onclick="filterGenre('أكشن', this)" class="genre-btn px-4 py-2 rounded-xl text-xs font-bold glass-card text-gray-300">أكشن</button>
                <button onclick="filterGenre('خيال', this)" class="genre-btn px-4 py-2 rounded-xl text-xs font-bold glass-card text-gray-300">خيال</button>
                <button onclick="filterGenre('مغامرة', this)" class="genre-btn px-4 py-2 rounded-xl text-xs font-bold glass-card text-gray-300">مغامرة</button>
            </div>
            <div id="grid-home" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </section>

        <section id="sec-latest" class="page-section"><div id="grid-latest" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div></section>
        <section id="sec-favorites" class="page-section"><div id="grid-favorites" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div></section>
        <section id="sec-history" class="page-section"><div id="grid-history" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div></section>
    </main>

    <!-- نافذة طلب الأنمي -->
    <div id="requestModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-[115] hidden items-center justify-center p-4">
        <div class="glass-card max-w-md w-full rounded-3xl p-6 relative border border-gold/40 shadow-2xl">
            <button onclick="closeRequestModal()" class="absolute top-4 left-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-xl font-bold gold-text mb-4">طلب أنمي جديد</h3>
            <input type="text" id="reqAnimeInput" placeholder="اكتب اسم الأنمي..." class="w-full bg-dark border border-dark-border rounded-xl px-4 py-2.5 text-sm text-white mb-4">
            <button onclick="submitAnimeRequest()" class="w-full gold-bg text-black font-bold py-2.5 rounded-xl text-sm">إرسال الطلب</button>
        </div>
    </div>

    <!-- مشغل الحلقات -->
    <div id="playerModal" class="fixed inset-0 bg-black/98 z-[120] hidden flex-col justify-center items-center p-2">
        <div class="w-full max-w-5xl relative">
            <div class="flex justify-between items-center mb-3">
                <h3 id="playerTitle" class="text-xl font-black gold-text"></h3>
                <button onclick="closePlayer()" class="text-white bg-red-600 px-4 py-2 rounded-xl text-xs">إغلاق</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2 aspect-video bg-black"><iframe id="animeIframe" src="" class="w-full h-full border-0"></iframe></div>
                <div class="glass-card p-4 h-[350px] overflow-y-auto" id="episodeList"></div>
            </div>
        </div>
    </div>

    <script src="anime-data.js"></script>
    <script src="player.js"></script>
    <script src="app.js"></script>
</body>
</html>

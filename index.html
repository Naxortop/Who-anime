<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Anime | المنصة العربية للأنمي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- الهيدر العلوي -->
    <header>
        <div class="nav-container">
            <a class="logo" onclick="nav('home')">
                <i class="fa-solid fa-play-circle" style="color: #ff9800;"></i> WHO ANIME
            </a>
            
            <ul class="nav-menu">
                <li><a onclick="nav('home')" id="nav-home" class="active">الرئيسية</a></li>
                <li><a onclick="nav('latest')" id="nav-latest">أحدث الحلقات</a></li>
                <li><a onclick="nav('favorites')" id="nav-favorites">المفضلة (<span id="favCount">0</span>)</a></li>
                <li><a onclick="nav('history')" id="nav-history">السجل</a></li>
            </ul>

            <div style="display: flex; gap: 8px; align-items: center;">
                <input type="text" id="searchInput" oninput="searchAnime()" placeholder="ابحث عن أنمي..." style="background: #0f1015; border: 1px solid #222531; padding: 6px 12px; border-radius: 6px; color: #fff; font-size: 0.8rem; outline: none;">
                <button onclick="playRandomAnime()" class="btn-witinime" style="padding: 6px 10px;" title="أنمي عشوائي"><i class="fa-solid fa-dice"></i></button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي للموقع -->
    <main>
        <!-- الرئيسية -->
        <section id="sec-home" class="page-section active">
            <div style="margin-bottom: 1.5rem; background: #171821; padding: 1.5rem; border-radius: 8px; border-right: 4px solid #ff9800;">
                <h2 style="font-size: 1.2rem; color: #fff; margin-bottom: 5px;">مرحباً بك في Who Anime</h2>
                <p style="font-size: 0.85rem; color: #9ca3af;">تصفح أقوى وأحدث الأنميات المترجمة والمدبلجة بجودة عالية وبدون إعلانات مزعجة.</p>
            </div>

            <h3 style="font-size: 1.1rem; color: #ff9800; margin-bottom: 1rem; border-bottom: 1px solid #222531; padding-bottom: 6px;">
                <i class="fa-solid fa-fire"></i> قائمة الأنميات المتاحة
            </h3>
            
            <div id="grid-home" class="anime-grid"></div>
        </section>

        <!-- أحدث الحلقات -->
        <section id="sec-latest" class="page-section">
            <h3 style="font-size: 1.1rem; color: #ff9800; margin-bottom: 1rem; border-bottom: 1px solid #222531; padding-bottom: 6px;">
                <i class="fa-solid fa-bolt"></i> أحدث الحلقات المضافة
            </h3>
            <div id="grid-latest" class="anime-grid"></div>
        </section>

        <!-- المفضلة -->
        <section id="sec-favorites" class="page-section">
            <h3 style="font-size: 1.1rem; color: #ff9800; margin-bottom: 1rem; border-bottom: 1px solid #222531; padding-bottom: 6px;">
                <i class="fa-solid fa-heart"></i> أنمياتي المفضلة
            </h3>
            <div id="grid-favorites" class="anime-grid"></div>
        </section>

        <!-- السجل -->
        <section id="sec-history" class="page-section">
            <h3 style="font-size: 1.1rem; color: #ff9800; margin-bottom: 1rem; border-bottom: 1px solid #222531; padding-bottom: 6px;">
                <i class="fa-solid fa-clock-rotate-left"></i> سجل المشاهدة الأخير
            </h3>
            <div id="grid-history" class="anime-grid"></div>
        </section>
    </main>

    <!-- نافذة مشغل الحلقات (Modal) -->
    <div id="playerModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; align-items:center; justify-content:center; padding:1rem;">
        <div style="max-width: 900px; width: 100%; background: #171821; border-radius: 8px; padding: 1.25rem; border: 1px solid #222531;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 id="playerTitle" style="color: #ff9800; font-size: 1rem;"></h3>
                <button onclick="closePlayer()" style="background: #ef4444; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 700;">إغلاق</button>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
                <div style="aspect-ratio: 16/9; width: 100%; background: #000; border-radius: 6px; overflow: hidden;">
                    <iframe id="animeIframe" src="" style="width: 100%; height: 100%; border: none;" allowfullscreen></iframe>
                </div>
                <div style="background: #0f1015; padding: 10px; border-radius: 6px; max-height: 150px; overflow-y: auto;" id="episodeList"></div>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer>
        <p>WHO ANIME &copy; 2026 - جميع الحقوق محفوظة</p>
    </footer>

    <!-- ربط ملفات السكربتات الأساسية -->
    <script src="anime-data.js"></script>
    <script src="player.js"></script>
    <script src="app.js"></script>
</body>
</html>

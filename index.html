<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Anime | المنصة الأسطورية الخارقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-dark text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- الإشعارات -->
    <div id="toast" class="glass-panel px-6 py-3 rounded-full text-gold font-bold shadow-2xl flex items-center gap-3 border border-gold/40">
        <i id="toastIcon" class="fa-solid fa-circle-check"></i>
        <span id="toastMsg">تمت العملية بنجاح</span>
    </div>

    <!-- الشريط العلوي الاحترافي المتجاوب -->
    <header class="fixed top-0 w-full z-50 glass-panel px-4 lg:px-10 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-4">
            
            <div class="flex items-center gap-8">
                <div class="text-xl lg:text-2xl font-black cursor-pointer gold-text tracking-wider flex items-center gap-2" onclick="nav('home')">
                    <i class="fa-solid fa-crown text-gold"></i> WHO ANIME
                </div>
                <!-- روابط التصفح للشاشات المتوسطة والكبيرة -->
                <nav class="hidden md:flex gap-6 font-bold text-xs lg:text-sm">
                    <a onclick="nav('home')" id="nav-home" class="cursor-pointer hover:text-gold transition text-gold">الرئيسية</a>
                    <a onclick="nav('latest')" id="nav-latest" class="cursor-pointer hover:text-gold transition text-gray-300">أحدث الحلقات</a>
                    <a onclick="nav('favorites')" id="nav-favorites" class="cursor-pointer hover:text-gold transition text-gray-300">المفضلة (<span id="favCount">0</span>)</a>
                    <a onclick="nav('history')" id="nav-history" class="cursor-pointer hover:text-gold transition text-gray-300">السجل</a>
                </nav>
            </div>

            <div class="flex items-center gap-3">
                <div class="relative hidden sm:block">
                    <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="searchAnime()" placeholder="ابحث في المكتبة..." class="bg-dark border border-dark-border rounded-full pr-9 pl-4 py-1.5 text-xs focus:outline-none focus:border-gold w-44 lg:w-64 text-white">
                </div>
                <button onclick="playRandomAnime()" title="عشوائي" class="w-9 h-9 rounded-full glass-panel hover:border-gold hover:text-gold flex items-center justify-center text-xs transition">
                    <i class="fa-solid fa-dice text-gold"></i>
                </button>
                <button onclick="openRequestModal()" title="طلب أنمي" class="w-9 h-9 rounded-full glass-panel hover:border-gold hover:text-gold flex items-center justify-center text-xs transition">
                    <i class="fa-solid fa-film"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 pt-24 pb-20 md:pb-10 px-4 lg:px-10 max-w-7xl mx-auto w-full">
        
        <!-- البانر السينمائي -->
        <section id="sec-home" class="page-section active">
            <div class="relative rounded-3xl overflow-hidden glass-panel p-6 lg:p-12 mb-10 flex flex-col md:flex-row items-center justify-between gap-8 border border-gold/30">
                <div class="z-10 md:w-3/5 space-y-4">
                    <span class="bg-gold/20 text-gold px-3.5 py-1 rounded-full text-xs font-bold border border-gold/40">🔥 الأكثر مشاهدة اليوم</span>
                    <h1 class="text-3xl lg:text-5xl font-black leading-tight">Attack on Titan <br><span class="gold-text text-2xl lg:text-3xl">الهجوم على العمالقة</span></h1>
                    <p class="text-gray-400 text-xs lg:text-sm leading-relaxed max-w-xl">شاهد الملحمة الأخيرة كاملة بجودة عالية وسيرفرات فائقة السرعة بدون إعلانات.</p>
                    <div class="flex gap-4 pt-2">
                        <button onclick="openPlayer(1, 1)" class="gold-btn px-7 py-3 rounded-xl text-xs lg:text-sm flex items-center gap-2 shadow-lg">
                            <i class="fa-solid fa-play"></i> مشاهدة الآن
                        </button>
                        <button onclick="openDetails(1)" class="glass-panel hover:border-gold px-6 py-3 rounded-xl text-xs lg:text-sm font-bold transition">التفاصيل</button>
                    </div>
                </div>
                <div class="hidden md:block w-72 relative z-10">
                    <img src="https://cdn.myanimelist.net/images/anime/10/47347.jpg" class="rounded-2xl shadow-2xl border-2 border-gold/40 w-full object-cover aspect-[3/4]">
                </div>
            </div>

            <!-- الفلترة السريعة -->
            <div class="flex gap-2 overflow-x-auto pb-4 mb-6">
                <button onclick="filterGenre('الكل', this)" class="genre-btn active px-5 py-2 rounded-xl text-xs font-bold bg-gold text-black shadow-md whitespace-nowrap">الكل</button>
                <button onclick="filterGenre('أكشن', this)" class="genre-btn px-5 py-2 rounded-xl text-xs font-bold glass-panel text-gray-300 hover:border-gold transition whitespace-nowrap">أكشن</button>
                <button onclick="filterGenre('خيال', this)" class="genre-btn px-5 py-2 rounded-xl text-xs font-bold glass-panel text-gray-300 hover:border-gold transition whitespace-nowrap">خيال</button>
                <button onclick="filterGenre('مغامرة', this)" class="genre-btn px-5 py-2 rounded-xl text-xs font-bold glass-panel text-gray-300 hover:border-gold transition whitespace-nowrap">مغامرة</button>
                <button onclick="filterGenre('دراما', this)" class="genre-btn px-5 py-2 rounded-xl text-xs font-bold glass-panel text-gray-300 hover:border-gold transition whitespace-nowrap">دراما</button>
            </div>

            <div id="grid-home" class="responsive-grid"></div>
        </section>

        <!-- باقي الأقسام -->
        <section id="sec-latest" class="page-section"><div id="grid-latest" class="responsive-grid"></div></section>
        <section id="sec-favorites" class="page-section"><div id="grid-favorites" class="responsive-grid"></div></section>
        <section id="sec-history" class="page-section"><div id="grid-history" class="responsive-grid"></div></section>
    </main>

    <!-- شريط الموبايل السفلي (يختفي في الشاشات الكبيرة تلقائياً) -->
    <div class="md:hidden flex justify-around bg-dark/95 border-t border-dark-border py-2.5 fixed bottom-0 w-full z-40 text-xs font-bold backdrop-blur-md">
        <a onclick="nav('home')" id="mob-home" class="text-gold flex flex-col items-center gap-1"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <a onclick="nav('latest')" id="mob-latest" class="text-gray-400 flex flex-col items-center gap-1"><i class="fa-solid fa-bolt"></i> الأحدث</a>
        <a onclick="nav('favorites')" id="mob-favorites" class="text-gray-400 flex flex-col items-center gap-1"><i class="fa-solid fa-heart"></i> المفضلة</a>
        <a onclick="nav('history')" id="mob-history" class="text-gray-400 flex flex-col items-center gap-1"><i class="fa-solid fa-clock-rotate-left"></i> السجل</a>
    </div>

    <!-- مشغل الحلقات السينمائي المتجاوب -->
    <div id="playerModal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[120] hidden flex-col justify-center items-center p-3 md:p-8">
        <div class="w-full max-w-6xl relative">
            <div class="flex justify-between items-center mb-3">
                <h3 id="playerTitle" class="text-lg lg:text-2xl font-black gold-text"></h3>
                <button onclick="closePlayer()" class="text-white bg-red-600/80 hover:bg-red-600 px-4 py-1.5 rounded-xl text-xs font-bold transition">إغلاق <i class="fa-solid fa-xmark ml-1"></i></button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                <div class="lg:col-span-2 aspect-video bg-black rounded-2xl overflow-hidden border border-gold/40 shadow-2xl">
                    <iframe id="animeIframe" src="" class="w-full h-full border-0" allowfullscreen></iframe>
                </div>
                <div class="glass-panel rounded-2xl p-4 h-[250px] lg:h-[400px] flex flex-col">
                    <h4 class="text-xs font-bold gold-text mb-3 border-b border-dark-border pb-2">قائمة الحلقات</h4>
                    <div id="episodeList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة تفاصيل الأنمي -->
    <div id="detailsModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-[110] hidden items-center justify-center p-4">
        <div class="glass-panel max-w-xl w-full rounded-3xl p-6 relative border border-gold/40 shadow-2xl">
            <button onclick="closeDetails()" class="absolute top-4 left-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="flex flex-col sm:flex-row gap-6 items-center">
                <img id="detImg" src="" class="w-36 h-48 object-cover rounded-2xl border border-gold/40 shadow-xl">
                <div class="space-y-3 text-right w-full">
                    <h3 id="detTitle" class="text-2xl font-black gold-text"></h3>
                    <div class="flex gap-4 text-xs text-gray-400">
                        <span id="detRating" class="text-gold font-bold"></span>
                        <span id="detEp"></span>
                        <span id="detGenre" class="bg-gold/15 px-2.5 py-0.5 rounded-lg text-gold"></span>
                    </div>
                    <p id="detDesc" class="text-gray-300 text-xs leading-relaxed"></p>
                    <button id="detPlayBtn" class="gold-btn px-6 py-2.5 rounded-xl text-xs font-bold">تشغيل الحلقة 1</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة طلب الأنمي -->
    <div id="requestModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-[115] hidden items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full rounded-3xl p-6 relative border border-gold/40 shadow-2xl">
            <button onclick="closeRequestModal()" class="absolute top-4 left-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-xl font-bold gold-text mb-4">طلب أنمي جديد</h3>
            <input type="text" id="reqAnimeInput" placeholder="اسم الأنمي..." class="w-full bg-dark border border-dark-border rounded-xl px-4 py-2.5 text-xs text-white mb-4 focus:outline-none focus:border-gold">
            <button onclick="submitAnimeRequest()" class="w-full gold-btn py-2.5 rounded-xl text-xs">إرسال الطلب</button>
        </div>
    </div>

    <script src="anime-data.js"></script>
    <script src="player.js"></script>
    <script src="app.js"></script>
</body>
</html>
